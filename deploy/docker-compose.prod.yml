name: waze-issues

services:
  api:
    image: ${WAZE_ISSUES_IMAGE:-waze-issues-api:local}
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: waze-issues-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      API_KEY: ${API_KEY:?set API_KEY}
      PORT: 3000
    ports:
      - '${HOST_HTTP_PORT:-8095}:3000'
    networks:
      - postgres_app-network
      - default

  static:
    image: nginx:alpine
    container_name: waze-issues-static
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${HOST_STATIC_PORT:-8096}:80'

networks:
  postgres_app-network:
    external: true
    name: postgres_app-network
