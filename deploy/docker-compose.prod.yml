name: waze-issues

services:
  api:
    image: ${WAZE_ISSUES_IMAGE:-ghcr.io/ixxvivxxi/waze-issues:api}
    container_name: waze-issues-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PORT: 3000
    ports:
      - '127.0.0.1:${HOST_HTTP_PORT:-8095}:3000'
    networks:
      - postgres_app-network
      - default

  static:
    image: nginx:alpine
    container_name: waze-issues-static
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${HOST_STATIC_PORT:-8096}:80'

networks:
  postgres_app-network:
    external: true
    name: postgres_app-network
