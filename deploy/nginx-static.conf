server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  autoindex off;

  location = /app.apk {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="waze-issues.apk"';
    try_files /app.apk =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
