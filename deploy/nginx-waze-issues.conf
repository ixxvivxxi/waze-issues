# Host nginx vhost — install with:
#   sudo cp deploy/nginx-waze-issues.conf /etc/nginx/sites-available/waze-issues
#   sudo ln -sf /etc/nginx/sites-available/waze-issues /etc/nginx/sites-enabled/waze-issues
#   sudo certbot --nginx -d waze-issues.ster.by
#   sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  listen [::]:80;
  server_name waze-issues.ster.by;

  client_max_body_size 50m;

  location = /app.apk {
    proxy_pass http://127.0.0.1:8096/app.apk;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://127.0.0.1:8095/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
