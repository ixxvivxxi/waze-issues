name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing/waze-issues.keystore
          printf '%s\n' \
            "storeFile=waze-issues.keystore" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > signing/keystore.properties
      - name: Assemble release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Assemble debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Generate version.json
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE" | head -1)"
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE" | head -1)"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s"}\n' \
            "$CODE" "$NAME" "https://waze-issues.ster.by/app.apk" \
            > app/build/outputs/apk/release/version.json
          cat app/build/outputs/apk/release/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: waze-issues-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/version.json
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Only signed release builds from main are published for download.
      - name: Publish APK to VPS
        if: >-
          env.HAS_KEYSTORE == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/version.json
          target: /home/${{ secrets.DEPLOY_USER }}/waze-issues/deploy/public
          strip_components: 6
      - name: Rename published APK
        if: >-
          env.HAS_KEYSTORE == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/waze-issues/deploy/public
            mv -f app-release.apk app.apk
            ls -la app.apk
            echo "APK_PUBLISHED"
