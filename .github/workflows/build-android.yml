name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Rolling GitHub Release tag — stable download URLs for in-app updates.
      APK_RELEASE_TAG: android-latest
      APK_DOWNLOAD_URL: https://github.com/ixxvivxxi/waze-issues/releases/download/android-latest/app.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing/waze-issues.keystore
          printf '%s\n' \
            "storeFile=waze-issues.keystore" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > signing/keystore.properties
      - name: Assemble release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Assemble debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Stage release files
        if: env.HAS_KEYSTORE == 'true'
        id: stage
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE" | head -1)"
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE" | head -1)"
          mkdir -p publish
          cp android/app/build/outputs/apk/release/app-release.apk publish/app.apk
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s"}\n' \
            "$CODE" "$NAME" "$APK_DOWNLOAD_URL" > publish/version.json
          cp deploy/public/index.html publish/index.html
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          cat publish/version.json
          ls -la publish/
      - uses: actions/upload-artifact@v4
        with:
          name: waze-issues-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            publish/app.apk
            publish/version.json
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed builds from main → GitHub Releases (domain-independent).
      - name: Publish to GitHub Releases
        if: >-
          env.HAS_KEYSTORE == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.stage.outputs.version_name }}
        run: |
          set -euo pipefail
          VER_TAG="android-v${VERSION_NAME}"

          # Immutable-ish per-version release (history).
          if gh release view "$VER_TAG" >/dev/null 2>&1; then
            gh release upload "$VER_TAG" publish/app.apk publish/version.json --clobber
          else
            gh release create "$VER_TAG" publish/app.apk publish/version.json \
              --title "Android ${VERSION_NAME}" \
              --notes "Signed release APK ${VERSION_NAME}." \
              --latest=false
          fi

          # Rolling tag used by the app for update checks.
          if gh release view "$APK_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$APK_RELEASE_TAG" publish/app.apk publish/version.json --clobber
          else
            gh release create "$APK_RELEASE_TAG" publish/app.apk publish/version.json \
              --title "Android (latest)" \
              --notes "Rolling latest APK + version.json for in-app updates." \
              --latest=false
          fi

          echo "APK_PUBLISHED"
          echo "manifest: https://github.com/ixxvivxxi/waze-issues/releases/download/${APK_RELEASE_TAG}/version.json"
          echo "apk:      $APK_DOWNLOAD_URL"

      # Transition mirror: older installs still poll the VPS for version.json.
      - name: Mirror APK to VPS
        if: >-
          env.HAS_KEYSTORE == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: publish/app.apk,publish/version.json,publish/index.html
          target: /home/${{ secrets.DEPLOY_USER }}/waze-issues/deploy/public
          strip_components: 1
      - name: Confirm VPS mirror
        if: >-
          env.HAS_KEYSTORE == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/waze-issues/deploy/public
            ls -la app.apk version.json index.html
            cat version.json
            echo "VPS_MIRROR_OK"
